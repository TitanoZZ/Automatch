<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Busca tu coche en España</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .car-card { border: 1px solid #ccc; border-radius: 5px; padding: 10px; margin-bottom: 15px; display: flex; }
    .car-card img { max-width: 150px; margin-right: 15px; }
    .car-info { display: flex; flex-direction: column; justify-content: center; }
    label { display: block; margin-top: 10px; }
    input, select { width: 200px; padding: 5px; margin-top: 5px; }
    button { margin-top: 15px; padding: 7px 15px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Busca tu coche en España</h1>
  
  <form id="filter-form">
    <label>
      Marca:
      <select id="marca">
        <option value="">--Todos--</option>
        <option value="Seat">Seat</option>
        <option value="Audi">Audi</option>
        <option value="Renault">Renault</option>
        <option value="Ford">Ford</option>
      </select>
    </label>

    <label>
      Modelo:
      <input type="text" id="modelo" placeholder="Ej: Ibiza" />
    </label>

    <label>
      Tipo:
      <select id="tipo">
        <option value="">--Todos--</option>
        <option value="SUV">SUV</option>
        <option value="Berlina">Berlina</option>
        <option value="Compacto">Compacto</option>
      </select>
    </label>

    <label>
      Combustible:
      <select id="combustible">
        <option value="">--Todos--</option>
        <option value="Gasolina">Gasolina</option>
        <option value="Diésel">Diésel</option>
        <option value="Eléctrico">Eléctrico</option>
      </select>
    </label>

    <label>
      Precio máximo (€):
      <input type="number" id="precio-max" placeholder="Ej: 20000" />
    </label>

    <label>
      Año mínimo:
      <input type="number" id="anio-min" placeholder="Ej: 2015" />
    </label>

    <button type="button" onclick="filtrarCoches()">Buscar</button>
  </form>

  <div id="resultados"></div>

  <script>
    const coches = [
      {
        marca: "Seat",
        modelo: "Ibiza",
        tipo: "Compacto",
        combustible: "Gasolina",
        precio: 15000,
        anio: 2018,
        foto: "https://upload.wikimedia.org/wikipedia/commons/thumb/f/f3/Seat_Ibiza_1.0_EcoTSI_SFR_2020_%28cropped%29.jpg/320px-Seat_Ibiza_1.0_EcoTSI_SFR_2020_%28cropped%29.jpg"
      },
      {
        marca: "Audi",
        modelo: "Q5",
        tipo: "SUV",
        combustible: "Diésel",
        precio: 40000,
        anio: 2019,
        foto: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/2018_Audi_Q5_S_Line_2.0_Front.jpg/320px-2018_Audi_Q5_S_Line_2.0_Front.jpg"
      },
      {
        marca: "Renault",
        modelo: "Clio",
        tipo: "Berlina",
        combustible: "Gasolina",
        precio: 12000,
        anio: 2016,
        foto: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/ec/Renault_Clio_1.2_16V_GSL_RSi_Cup_Joan_Cano_Motorsport_%28cropped%29.jpg/320px-Renault_Clio_1.2_16V_GSL_RSi_Cup_Joan_Cano_Motorsport_%28cropped%29.jpg"
      },
      {
        marca: "Ford",
        modelo: "Focus",
        tipo: "Compacto",
        combustible: "Diésel",
        precio: 18000,
        anio: 2017,
        foto: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/2018_Ford_Focus_ST-Line_X_-_Frontright%2C_31-08-2018.jpg/320px-2018_Ford_Focus_ST-Line_X_-_Frontright%2C_31-08-2018.jpg"
      }
    ];

    function filtrarCoches() {
      const marca = document.getElementById("marca").value.toLowerCase();
      const modelo = document.getElementById("modelo").value.toLowerCase();
      const tipo = document.getElementById("tipo").value.toLowerCase();
      const combustible = document.getElementById("combustible").value.toLowerCase();
      const precioMax = parseInt(document.getElementById("precio-max").value);
      const anioMin = parseInt(document.getElementById("anio-min").value);

      const resultados = coches.filter(coche => {
        return (marca === "" || coche.marca.toLowerCase() === marca)
          && (modelo === "" || coche.modelo.toLowerCase().includes(modelo))
          && (tipo === "" || coche.tipo.toLowerCase() === tipo)
          && (combustible === "" || coche.combustible.toLowerCase() === combustible)
          && (isNaN(precioMax) || coche.precio <= precioMax)
          && (isNaN(anioMin) || coche.anio >= anioMin);
      });

      mostrarResultados(resultados);
    }

    function mostrarResultados(cochesFiltrados) {
      const contenedor = document.getElementById("resultados");
      contenedor.innerHTML = "";

      if (cochesFiltrados.length === 0) {
        contenedor.innerHTML = "<p>No se encontraron coches con esas características.</p>";
        return;
      }

      cochesFiltrados.forEach(coche => {
        const card = document.createElement("div");
        card.className = "car-card";
        card.innerHTML = `
          <img src="${coche.foto}" alt="Foto ${coche.marca} ${coche.modelo}" />
          <div class="car-info">
            <h3>${coche.marca} ${coche.modelo}</h3>
            <p>Tipo: ${coche.tipo}</p>
            <p>Combustible: ${coche.combustible}</p>
            <p>Año: ${coche.anio}</p>
            <p>Precio: €${coche.precio.toLocaleString()}</p>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    // Mostrar todos los coches inicialmente
    mostrarResultados(coches);
  </script>
</body>
</html>
